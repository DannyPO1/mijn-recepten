
name: Install Mijn Recepten ZIP

on:
  push:
    branches:
      - main
    paths:
      - 'MijnRecepten-iPhone-v*.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-mijn-recepten-zip
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Select version ZIP
        id: select_zip
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          if [[ "$EVENT_NAME" == "push" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            mapfile -t changed_zips < <(
              git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" -- 'MijnRecepten-iPhone-v*.zip' |
              grep -E '^MijnRecepten-iPhone-v[0-9]+\.[0-9]+\.[0-9]+\.zip$' || true
            )
            if [[ ${#changed_zips[@]} -ne 1 ]]; then
              echo "Upload exactly one version ZIP per commit."
              exit 1
            fi
            zipfile="${changed_zips[0]}"
          else
            zips=(MijnRecepten-iPhone-v*.zip)
            if [[ ${#zips[@]} -eq 0 ]]; then
              echo "No version ZIP found in the repository root."
              exit 1
            fi
            zipfile="$(printf '%s\n' "${zips[@]}" | sort -V | tail -n 1)"
          fi

          if [[ ! -f "$zipfile" ]]; then
            echo "Selected ZIP does not exist: $zipfile"
            exit 1
          fi

          version="${zipfile#MijnRecepten-iPhone-v}"
          version="${version%.zip}"
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists. Use a new version number."
            exit 1
          fi

          echo "zipfile=$zipfile" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Selected $zipfile (version $version)"

      - name: Validate and extract ZIP
        shell: bash
        env:
          ZIPFILE: ${{ steps.select_zip.outputs.zipfile }}
        run: |
          set -euo pipefail
          rm -rf .install-mijn-recepten
          mkdir -p .install-mijn-recepten
          unzip -q "$ZIPFILE" -d .install-mijn-recepten

          if [[ -f .install-mijn-recepten/index.html ]]; then
            src=".install-mijn-recepten"
          else
            mapfile -t candidates < <(
              find .install-mijn-recepten -mindepth 2 -maxdepth 3 -type f -name index.html
            )
            if [[ ${#candidates[@]} -ne 1 ]]; then
              echo "ZIP must contain one index.html at the root or one folder deep."
              exit 1
            fi
            src="$(dirname "${candidates[0]}")"
          fi

          for file in index.html styles.css app.js manifest.webmanifest sw.js README.md; do
            if [[ ! -f "$src/$file" ]]; then
              echo "Required app file missing: $file"
              exit 1
            fi
          done

          for file in icons/icon-192.png icons/icon-512.png icons/apple-touch-icon.png icons/favicon.png; do
            if [[ ! -f "$src/$file" ]]; then
              echo "Required icon file missing: $file"
              exit 1
            fi
          done

          for file in index.html styles.css app.js manifest.webmanifest sw.js README.md; do
            cp "$src/$file" "./$file"
          done

          rm -rf ./icons
          cp -R "$src/icons" ./icons
          rm -rf .install-mijn-recepten

      - name: Commit installed app files and remove ZIP
        shell: bash
        env:
          ZIPFILE: ${{ steps.select_zip.outputs.zipfile }}
          VERSION: ${{ steps.select_zip.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f "$ZIPFILE"
          git add index.html styles.css app.js manifest.webmanifest sw.js README.md icons/
          git add -u -- "$ZIPFILE"
          if git diff --cached --quiet; then
            echo "No app changes to commit."
            exit 1
          fi
          git commit -m "Release Mijn Recepten v${VERSION}"
          git push origin main

      - name: Create version tag
        shell: bash
        env:
          VERSION: ${{ steps.select_zip.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists."
            exit 1
          fi
          git tag -a "$tag" -m "Mijn Recepten $tag"
          git push origin "$tag"
