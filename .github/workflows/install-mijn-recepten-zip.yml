
name: Install Mijn Recepten ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "MijnRecepten-iPhone-v1.0.0.zip"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract app ZIP
        run: |
          unzip -o MijnRecepten-iPhone-v1.0.0.zip -d extracted
          cp -r extracted/. .
          rm -rf extracted
          rm -f MijnRecepten-iPhone-v1.0.0.zip

      - name: Commit app files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Install Mijn Recepten app files"
            git push
          fi
