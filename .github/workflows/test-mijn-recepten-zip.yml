
name: Test Mijn Recepten ontwerpbranch

on:
  push:
    branches:
      - feature/nieuw-ontwerp
    paths:
      - 'MijnRecepten-iPhone-v*.zip'
      - '.github/workflows/test-mijn-recepten-zip.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-mijn-recepten-zip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install-test:
    # Veiligheidscontrole: nooit bestanden naar main installeren.
    if: github.ref == 'refs/heads/feature/nieuw-ontwerp'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ontwerpbranch
        uses: actions/checkout@v4
        with:
          ref: feature/nieuw-ontwerp
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Select version ZIP
        id: select_zip
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          zips=(MijnRecepten-iPhone-v*.zip)

          if [[ ${#zips[@]} -eq 0 ]]; then
            echo "Geen versie-ZIP gevonden in de hoofdmap."
            exit 1
          fi

          zipfile="$(printf '%s\n' "${zips[@]}" | sort -V | tail -n 1)"

          version="${zipfile#MijnRecepten-iPhone-v}"
          version="${version%.zip}"

          echo "zipfile=$zipfile" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Geselecteerd: $zipfile (testversie $version)"

      - name: Valideer en pak ZIP uit
        shell: bash
        env:
          ZIPFILE: ${{ steps.select_zip.outputs.zipfile }}
        run: |
          set -euo pipefail

          rm -rf .install-mijn-recepten
          mkdir -p .install-mijn-recepten

          unzip -q "$ZIPFILE" -d .install-mijn-recepten

          if [[ -f .install-mijn-recepten/index.html ]]; then
            src=".install-mijn-recepten"
          else
            mapfile -t candidates < <(
              find .install-mijn-recepten -mindepth 2 -maxdepth 3 -type f -name index.html
            )

            if [[ ${#candidates[@]} -ne 1 ]]; then
              echo "ZIP moet één index.html bevatten in de hoofdmap of één mapniveau lager."
              exit 1
            fi

            src="$(dirname "${candidates[0]}")"
          fi

          for file in index.html styles.css app.js manifest.webmanifest sw.js README.md; do
            if [[ ! -f "$src/$file" ]]; then
              echo "Verplicht bestand ontbreekt: $file"
              exit 1
            fi
          done

          for file in icons/icon-192.png icons/icon-512.png icons/apple-touch-icon.png icons/favicon.png; do
            if [[ ! -f "$src/$file" ]]; then
              echo "Verplicht pictogram ontbreekt: $file"
              exit 1
            fi
          done

          if [[ ! -d "$src/images/recipes" ]]; then
            echo "Fotobibliotheek ontbreekt: images/recipes/"
            exit 1
          fi

          if ! find "$src/images/recipes" -maxdepth 1 -type f -name '*.webp' | grep -q .; then
            echo "Geen WebP-foto's gevonden in images/recipes/."
            exit 1
          fi

          for file in index.html styles.css app.js manifest.webmanifest sw.js README.md; do
            cp "$src/$file" "./$file"
          done

          rm -rf ./icons
          cp -R "$src/icons" ./icons

          rm -rf ./images
          cp -R "$src/images" ./images

          rm -rf .install-mijn-recepten

          echo "App-bestanden en fotobibliotheek zijn gevalideerd en uitgepakt."

      - name: Commit app en fotobibliotheek naar ontwerpbranch
        shell: bash
        env:
          ZIPFILE: ${{ steps.select_zip.outputs.zipfile }}
          VERSION: ${{ steps.select_zip.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -f "$ZIPFILE"

          git add index.html styles.css app.js manifest.webmanifest sw.js README.md icons/ images/
          git add -u -- "$ZIPFILE"

          if git diff --cached --quiet; then
            echo "Geen wijzigingen gevonden om te committen."
            exit 1
          fi

          git commit -m "Test ontwerp Mijn Recepten v${VERSION}"
          git push origin feature/nieuw-ontwerp

      - name: Rapportage
        run: |
          echo "App en fotobibliotheek bijgewerkt op feature/nieuw-ontwerp."
          echo "Er is geen release-tag aangemaakt."
          echo "De branch main is door deze workflow niet aangepast."
