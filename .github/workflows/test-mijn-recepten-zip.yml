
name: Test Mijn Recepten ontwerpbranch

on:
  push:
    branches:
      - feature/nieuw-ontwerp
    paths:
      - 'MijnRecepten-iPhone-v*.zip'
      - '.github/workflows/test-mijn-recepten-zip.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-mijn-recepten-zip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install-test:
    # Safety guard: this workflow must never install files into main.
    if: github.ref == 'refs/heads/feature/nieuw-ontwerp'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ontwerpbranch
        uses: actions/checkout@v4
        with:
          ref: feature/nieuw-ontwerp
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Select version ZIP
        id: select_zip
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          if [[ "$EVENT_NAME" == "push" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            mapfile -t changed_zips < <(
              git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" -- 'MijnRecepten-iPhone-v*.zip' |
              grep -E '^MijnRecepten-iPhone-v[0-9]+\.[0-9]+\.[0-9]+\.zip$' || true
            )
            if [[ ${#changed_zips[@]} -ne 1 ]]; then
              echo "Upload exactly one version ZIP per commit."
              exit 1
            fi
            zipfile="${changed_zips[0]}"
          else
            zips=(MijnRecepten-iPhone-v*.zip)
            if [[ ${#zips[@]} -eq 0 ]]; then
              echo "No version ZIP found in the repository root."
              exit 1
            fi
            zipfile="$(printf '%s\n' "${zips[@]}" | sort -V | tail -n 1)"
          fi

          if [[ ! -f "$zipfile" ]]; then
            echo "Selected ZIP does not exist: $zipfile"
            exit 1
          fi

          version="${zipfile#MijnRecepten-iPhone-v}"
          version="${version%.zip}"
          echo "zipfile=$zipfile" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Selected $zipfile (test version $version; no release tag will be created)"

      - name: Validate and extract ZIP
        shell: bash
        env:
          ZIPFILE: ${{ steps.select_zip.outputs.zipfile }}
        run: |
          set -euo pipefail
          rm -rf .install-mijn-recepten
          mkdir -p .install-mijn-recepten
          unzip -q "$ZIPFILE" -d .install-mijn-recepten

          if [[ -f .install-mijn-recepten/index.html ]]; then
            src=".install-mijn-recepten"
          else
            mapfile -t candidates < <(
              find .install-mijn-recepten -mindepth 2 -maxdepth 3 -type f -name index.html
            )
            if [[ ${#candidates[@]} -ne 1 ]]; then
              echo "ZIP must contain one index.html at the root or one folder deep."
              exit 1
            fi
            src="$(dirname "${candidates[0]}")"
          fi

          for file in index.html styles.css app.js manifest.webmanifest sw.js README.md; do
            if [[ ! -f "$src/$file" ]]; then
              echo "Required app file missing: $file"
              exit 1
            fi
          done

          for file in icons/icon-192.png icons/icon-512.png icons/apple-touch-icon.png icons/favicon.png; do
            if [[ ! -f "$src/$file" ]]; then
              echo "Required icon file missing: $file"
              exit 1
            fi
          done

          for file in index.html styles.css app.js manifest.webmanifest sw.js README.md; do
            cp "$src/$file" "./$file"
          done

          rm -rf ./icons
          cp -R "$src/icons" ./icons
          rm -rf .install-mijn-recepten

      - name: Commit app files to ontwerpbranch and remove ZIP
        shell: bash
        env:
          ZIPFILE: ${{ steps.select_zip.outputs.zipfile }}
          VERSION: ${{ steps.select_zip.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -f "$ZIPFILE"
          git add index.html styles.css app.js manifest.webmanifest sw.js README.md icons/
          git add -u -- "$ZIPFILE"

          if git diff --cached --quiet; then
            echo "No app changes to commit."
            exit 1
          fi

          git commit -m "Test ontwerp Mijn Recepten v${VERSION}"
          git push origin feature/nieuw-ontwerp

      - name: Report test installation
        run: |
          echo "Testbestanden zijn bijgewerkt op feature/nieuw-ontwerp."
          echo "Er is geen release-tag aangemaakt en main is niet aangepast."
