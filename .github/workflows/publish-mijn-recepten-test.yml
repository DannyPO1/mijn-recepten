
name: Publish Mijn Recepten testapp

on:
  workflow_run:
    workflows:
      - Test Mijn Recepten ontwerpbranch
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-mijn-recepten-test
  cancel-in-progress: false

jobs:
  publish-test:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'feature/nieuw-ontwerp'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ontwerpbranch
        uses: actions/checkout@v4
        with:
          ref: feature/nieuw-ontwerp
          fetch-depth: 1

      - name: Controleer app-bestanden en foto's
        shell: bash
        run: |
          set -euo pipefail

          for file in index.html styles.css app.js manifest.webmanifest sw.js README.md; do
            test -f "$file" || {
              echo "Verplicht bestand ontbreekt: $file"
              exit 1
            }
          done

          for file in icons/icon-192.png icons/icon-512.png icons/apple-touch-icon.png icons/favicon.png; do
            test -f "$file" || {
              echo "Verplicht pictogram ontbreekt: $file"
              exit 1
            }
          done

          test -d images/recipes || {
            echo "Fotobibliotheek images/recipes ontbreekt."
            exit 1
          }

          find images/recipes -maxdepth 1 -type f -name '*.webp' | grep -q . || {
            echo "Geen WebP-foto's gevonden."
            exit 1
          }

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Werk uitsluitend de testmap bij
        shell: bash
        run: |
          set -euo pipefail

          cd main-repo

          mkdir -p test
          find test -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +

          cp ../index.html test/
          cp ../styles.css test/
          cp ../app.js test/
          cp ../manifest.webmanifest test/
          cp ../sw.js test/
          cp ../README.md test/

          cp -R ../icons test/icons
          cp -R ../images test/images

          touch test/.nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add test/

          if git diff --cached --quiet; then
            echo "Geen wijzigingen in de testapp."
            exit 0
          fi

          git commit -m "Publiceer Mijn Recepten testapp"
          git push origin main

      - name: Rapportage
        run: |
          echo "Testapp en fotobibliotheek bijgewerkt in test/."
          echo "Productiebestanden in de hoofdmap zijn niet gewijzigd."
