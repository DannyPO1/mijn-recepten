
name: Publish Mijn Recepten testapp

on:
  workflow_run:
    workflows:
      - Test Mijn Recepten ontwerpbranch
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-mijn-recepten-test
  cancel-in-progress: false

jobs:
  publish-test:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'feature/nieuw-ontwerp'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ontwerpbranch
        uses: actions/checkout@v4
        with:
          ref: feature/nieuw-ontwerp
          fetch-depth: 1

      - name: Controleer app-bestanden en foto's
        shell: bash
        run: |
          set -euo pipefail

          for file in index.html styles.css app.js manifest.webmanifest sw.js README.md; do
            test -f "$file" || {
              echo "Verplicht bestand ontbreekt: $file"
              exit 1
            }
          done

          for file in icons/icon-192.png icons/icon-512.png icons/apple-touch-icon.png icons/favicon.png; do
            test -f "$file" || {
              echo "Verplicht pictogram ontbreekt: $file"
              exit 1
            }
          done

          test -d images/recipes || {
            echo "Fotobibliotheek images/recipes ontbreekt."
            exit 1
          }

          find images/recipes -maxdepth 1 -type f -name '*.webp' | grep -q . || {
            echo "Geen WebP-foto's gevonden."
            exit 1
          }

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Publiceer testapp met TEST-label
        shell: bash
        run: |
          set -euo pipefail

          cd main-repo

          mkdir -p test
          find test -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +

          cp ../index.html test/
          cp ../styles.css test/
          cp ../app.js test/
          cp ../manifest.webmanifest test/
          cp ../sw.js test/
          cp ../README.md test/

          cp -R ../icons test/icons
          cp -R ../images test/images

          touch test/.nojekyll

          # Geef uitsluitend de testapp een eigen manifestnaam.
          python3 - <<'PY'
          import json
          from pathlib import Path
          import re

          manifest_path = Path("test/manifest.webmanifest")
          manifest = json.loads(
              manifest_path.read_text(encoding="utf-8")
          )
          manifest["name"] = "Mijn Recepten test"
          manifest["short_name"] = "Recepten test"
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          # Voeg de TEST-badge toe direct na het versie-element.
          html_path = Path("test/index.html")
          html = html_path.read_text(encoding="utf-8")

          # Verwijder eventuele eerder toegevoegde badges.
          html = re.sub(
              r'\s*<span class="test-label">TEST</span>',
              '',
              html
          )

          # Vind het versie-element in de topbar.
          pattern = (
              r'(<([a-zA-Z][\w-]*)\b'
              r'(?=[^>]*\bdata-app-version\b)'
              r'[^>]*>)(.*?)(</\2>)'
          )
          match = re.search(pattern, html, flags=re.DOTALL)

          if not match:
              raise SystemExit(
                  "Versie-element niet gevonden in index.html. "
                  "Publicatie afgebroken."
              )

          opening, tag, content, closing = match.groups()

          # Plaats versie en TEST in dezelfde verticale container.
          replacement = (
              '<span class="test-version-stack">'
              + opening
              + content
              + closing
              + '<span class="test-label">TEST</span>'
              + '</span>'
          )

          html = html[:match.start()] + replacement + html[match.end():]
          html_path.write_text(html, encoding="utf-8")

          # Styling uitsluitend in de testversie.
          css_path = Path("test/styles.css")
          css = css_path.read_text(encoding="utf-8")

          css += """

          /* Testversie: versie en label verticaal uitlijnen */
          .test-version-stack {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 6px;
            flex-shrink: 0;
          }

          .test-version-stack [data-app-version] {
            display: inline-flex;
            align-items: center;
            justify-content: center;
          }

          .test-version-stack .test-label {
            display: inline-block;
            align-self: center;
            margin: 0;
            padding: 3px 8px;
            border: 1px solid #b77932;
            border-radius: 999px;
            color: #8a5720;
            background: #f8ead7;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.12em;
            line-height: 1.4;
          }
          """

          css_path.write_text(css, encoding="utf-8")

          print("Manifestnaam en verticale TEST-badge ingesteld.")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add test/

          if git diff --cached --quiet; then
            echo "Geen wijzigingen in de testapp."
            exit 0
          fi

          git commit -m "Publiceer Mijn Recepten testapp met TEST-label"
          git push origin main

      - name: Rapportage
        run: |
          echo "Testapp gepubliceerd in test/."
          echo "TEST staat onder het versienummer."
          echo "Productiebestanden in de hoofdmap zijn niet gewijzigd."
