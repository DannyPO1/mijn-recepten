
name: Publish Mijn Recepten testapp

on:
  workflow_run:
    workflows:
      - Test Mijn Recepten ontwerpbranch
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-mijn-recepten-test
  cancel-in-progress: false

jobs:
  publish-test:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'feature/nieuw-ontwerp'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ontwerpbranch
        uses: actions/checkout@v4
        with:
          ref: feature/nieuw-ontwerp
          fetch-depth: 1

      - name: Controleer app-bestanden en foto's
        shell: bash
        run: |
          set -euo pipefail

          for file in index.html styles.css app.js manifest.webmanifest sw.js README.md; do
            test -f "$file" || {
              echo "Verplicht bestand ontbreekt: $file"
              exit 1
            }
          done

          for file in icons/icon-192.png icons/icon-512.png icons/apple-touch-icon.png icons/favicon.png; do
            test -f "$file" || {
              echo "Verplicht pictogram ontbreekt: $file"
              exit 1
            }
          done

          test -d images/recipes || {
            echo "Fotobibliotheek images/recipes ontbreekt."
            exit 1
          }

          find images/recipes -maxdepth 1 -type f -name '*.webp' | grep -q . || {
            echo "Geen WebP-foto's gevonden."
            exit 1
          }

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Werk uitsluitend de testmap bij
        shell: bash
        run: |
          set -euo pipefail

          cd main-repo

          mkdir -p test
          find test -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +

          cp ../index.html test/
          cp ../styles.css test/
          cp ../app.js test/
                    # Toon TEST direct onder het versienummer, uitsluitend in de testapp.
          python3 - <<'PY'
          from pathlib import Path

          path = Path("test/app.js")
          js = path.read_text(encoding="utf-8")

          marker = "const APP_VERSION = '1.7.8';"

          if marker not in js:
              raise SystemExit(
                  "APP_VERSION niet gevonden. Er zijn geen wijzigingen aangebracht."
              )

          print("Versienummer gevonden; app.js is klaar voor de testbadge.")
          PY
          cp ../manifest.webmanifest test/
          cp ../sw.js test/
          cp ../README.md test/

          cp -R ../icons test/icons
                    cp -R ../images test/images

          # Geef alleen de testapp een eigen naam.
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path("test/manifest.webmanifest")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["name"] = "Mijn Recepten test"
          manifest["short_name"] = "Mijn Recepten test"
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

          touch test/.nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add test/

          if git diff --cached --quiet; then
            echo "Geen wijzigingen in de testapp."
            exit 0
          fi

          git commit -m "Publiceer Mijn Recepten testapp"
          git push origin main

      
      - name: Voeg TEST-label toe aan testapp
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          html_path = Path("main-repo/test/index.html")
          html = html_path.read_text(encoding="utf-8")

          marker = 'data-app-version'
          if marker not in html:
              raise SystemExit(
                  "Geen element met data-app-version gevonden in index.html."
              )

          # Voeg een label toe direct na het versie-element in de topbar.
          import re

          pattern = r'(<[^>]*data-app-version[^>]*>.*?</[^>]+>)'
          match = re.search(pattern, html, flags=re.DOTALL)

          if not match:
              raise SystemExit(
                  "Versie-element niet veilig gevonden; HTML niet aangepast."
              )

          following = html[match.end():]
          if re.match(r'\s*<[^>]*class=["\'][^"\']*\btest-label\b', following):
              print("TEST-label staat al in de HTML.")
          else:
              label = '<span class="test-label">TEST</span>'
              html = html[:match.end()] + '\n' + label + html[match.end():]
              html_path.write_text(html, encoding="utf-8")
              print("TEST-label toegevoegd aan de testapp.")

          css_path = Path("main-repo/test/styles.css")
          css = css_path.read_text(encoding="utf-8")

          if ".test-label" not in css:
              css += """

          /* Alleen zichtbaar in de testpublicatie */
          .test-label {
            display: inline-block;
            margin-top: 4px;
            padding: 3px 8px;
            border: 1px solid #b77932;
            border-radius: 999px;
            color: #8a5720;
            background: #f8ead7;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.12em;
            line-height: 1.4;
          }
          """
              css_path.write_text(css, encoding="utf-8")
              print("Opmaak voor TEST-label toegevoegd.")

          PY

          cd main-repo
          git add test/index.html test/styles.css
          git commit -m "Voeg TEST-label toe aan testapp" || true
          git push origin main


      - name: Rapportage
        run: |
          echo "Testapp en fotobibliotheek bijgewerkt in test/."
          echo "Productiebestanden in de hoofdmap zijn niet gewijzigd."
