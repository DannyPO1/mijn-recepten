
name: Publish Mijn Recepten testapp

on:
  push:
    branches:
      - feature/nieuw-ontwerp
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'README.md'
      - 'icons/**'
      - 'images/**'
      - '.github/workflows/publish-mijn-recepten-test.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-mijn-recepten-test
  cancel-in-progress: false

jobs:
  publish-test:
    if: github.ref == 'refs/heads/feature/nieuw-ontwerp'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ontwerpbranch
        uses: actions/checkout@v4
        with:
          ref: feature/nieuw-ontwerp
          fetch-depth: 0

      - name: Controleer app-bestanden en foto's
        shell: bash
        run: |
          set -euo pipefail

          for file in index.html styles.css app.js manifest.webmanifest sw.js README.md; do
            test -f "$file" || {
              echo "Verplicht bestand ontbreekt: $file"
              exit 1
            }
          done

          for file in icons/icon-192.png icons/icon-512.png icons/apple-touch-icon.png icons/favicon.png; do
            test -f "$file" || {
              echo "Verplicht pictogram ontbreekt: $file"
              exit 1
            }
          done

          test -d images/recipes || {
            echo "Fotobibliotheek images/recipes ontbreekt."
            exit 1
          }

          find images/recipes -maxdepth 1 -type f -name '*.webp' | grep -q . || {
            echo "Geen WebP-foto's gevonden."
            exit 1
          }

      - name: Checkout main zonder productiebestanden te wijzigen
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Werk uitsluitend de testmap bij
        shell: bash
        run: |
          set -euo pipefail

          cd main-repo

          mkdir -p test

          # Vervang uitsluitend de inhoud van de testmap.
          find test -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +

          cp ../index.html test/
          cp ../styles.css test/
          cp ../app.js test/
          cp ../manifest.webmanifest test/
          cp ../sw.js test/
          cp ../README.md test/

          cp -R ../icons test/icons
          cp -R ../images test/images

          # Markeer de testmap als zelfstandige GitHub Pages-map.
          touch test/.nojekyll

          # Zorg dat de test-PWA zijn eigen URL en cache gebruikt.
          # De productiebestanden buiten test/ blijven ongemoeid.

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add test/

          if git diff --cached --quiet; then
            echo "Geen wijzigingen in de testapp."
            exit 0
          fi

          git commit -m "Publiceer Mijn Recepten testapp"
          git push origin main

      - name: Rapportage
        run: |
          echo "De testapp is bijgewerkt in de map test/ op main."
          echo "De map images/ is meegepubliceerd."
          echo "De productie-app in de hoofdmap is niet door deze workflow gewijzigd."
